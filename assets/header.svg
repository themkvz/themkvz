<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title description">
  <title id="title">Ihor Mukovoz</title>
  <desc id="description">Front-End Developer and Technical Lead building web and cross-platform products.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b16" />
      <stop offset="0.52" stop-color="#101633" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="0.55" stop-color="#6366f1" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.42" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <clipPath id="frame">
      <rect width="900" height="250" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="250" fill="url(#background)" />
    <rect width="900" height="250" fill="url(#grid)" />
    <circle cx="760" cy="50" r="220" fill="url(#glow)" filter="url(#blur)" />
    <circle cx="865" cy="200" r="130" fill="none" stroke="#22d3ee" stroke-opacity="0.2" />
    <circle cx="865" cy="200" r="85" fill="none" stroke="#818cf8" stroke-opacity="0.3" />
    <path d="M680 26H870V224H680Z" fill="none" stroke="url(#accent)" stroke-opacity="0.28" />
    <path d="M712 58H838V192H712Z" fill="none" stroke="#e0e7ff" stroke-opacity="0.12" />

    <text x="48" y="112" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="70" font-weight="750" letter-spacing="-2">Ihor Mukovoz</text>
    <rect x="48" y="131" width="450" height="5" rx="2.5" fill="url(#accent)" />
    <text x="48" y="196" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="39" font-weight="600" letter-spacing="-1">Front-End Developer &amp; Technical Lead</text>
  </g>
</svg>
